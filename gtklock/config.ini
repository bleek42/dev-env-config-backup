[main]
; gtk-theme=Sweet-Dark ; Specify GTK theme
style=.config/gtklock/cmatrix.css ; Specify style file
; layout= ; Load XML layout file
; background= ; Load background
; time-format= ; Specify a strftime(3) time format for the clock
; date-format= ; Set date format
follow-focus=true ; Follow focus between monitors
start-hidden=true ; Start with hidden form
idle-hide=true ; Hide form when idle
idle-timeout=10 ; Idle timeout in seconds
lock-command=hyprctl dispatch dpms off
unlock-command=hyprctl dispatch dpms on
; monitor-priority= ; Set monitor focus priority
modules=userinfo-module.so;runshell-module.so;powerbar-module.so

