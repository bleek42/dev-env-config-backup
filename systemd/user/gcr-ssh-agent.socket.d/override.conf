[Unit]
Description=GCR ssh-agent wrapper's listening stream socket

[Socket]
BindIPv6Only=both
IPTOS=reliability
Symlinks=/var/tmp/gcr/ssh
# ListenSequentialPacket=vsock:0:20022
PipeSize=8192M
SocketMode=0700
DirectoryMode=0700
MaxConnectionsPerSource=8
KeepAlive=true
ReusePort=true
PassPIDFD=true
RemoveOnStop=false
TimeoutSec=30s
DeferTrigger=patient
DeferTriggerMaxSec=180s
TriggerLimitIntervalSec=10s
TriggerLimitBurst=16

[Install]
WantedBy=sockets.target
