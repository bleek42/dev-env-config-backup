## ! Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

## ! FIRST LINE/ROW: Info & Status
## * First param ─┌
[username]
disabled = false
show_always = true
format = " [╭─$user]($style)[:](dimmed purple)"
style_root = "bold purple"
style_user = "bold green"

## * Second param
[hostname]
disabled = false
format = "[$hostname]($style) in "
ssh_only = false
style = "bold cyan"
trim_at = "-"

## * Third param
[directory]
style = "dimmed purple"
truncate_to_repo = true
truncation_length = 0
truncation_symbol = "repo: "

## * Fourth param
[sudo]
disabled = false

## * Before all the version info (python, nodejs, php, etc.)
[git_status]
ahead = "⇡${count}"
behind = "⇣${count}"
deleted = "x"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
style = "white"

## * Last param in the first line/row
[cmd_duration]
disabled = false
format = "took [$duration]($style)"
min_time = 1

## *# SECOND LINE/ROW: Prompt
## * Somethere at the beginning
[battery]
charging_symbol = ""
disabled = true
discharging_symbol = ""
full_symbol = ""

[[battery.display]] ## * "bold red" style when capacity is between 0% and 15%
style = "bold red"
threshold = 15

[[battery.display]] ## * "bold yellow" style when capacity is between 15% and 50%
style = "bold yellow"
threshold = 50

[[battery.display]] ## * "bold green" style when capacity is between 50% and 80%
style = "dimmed green"
threshold = 80

## * Prompt: optional param 1
[time]
disabled = true
format = " 🕙 $time($style)\n"
style = "bright white"
time_format = "%T"

## * Prompt: param 2
[character]
error_symbol = " [󱄑](bold red)"
success_symbol = " [╰─λ](bold green)"

## * SYMBOLS
[status]
disabled = false
format = '[\[$symbol$status_common_meaning$status_signal_name$status_maybe_int\]]($style)'
map_symbol = true
pipestatus = true
symbol = "🔴 "

[aws]
symbol = " "

