## ? See https://wiki.hyprland.org/Configuring/Keywords/ for more

bindr = SUPER, SUPER_L, exec, pkill wofi || uwsm-app -- "$(wofi --normal-window --allow-images --allow-markup --show drun --define=drun-print_desktop_file=true)"

## * Install Garuda Hyprland
bind = $mainMod, I, exec, ~/.local/bin/calamares.sh

## * Display clipboard history
bind = $mainMod, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

## * close the currently active application window
bindr = $mainMod, Q, killactive

bind = $mainMod SHIFT, T, togglefloating
bind = $mainMod SHIFT, 65, togglefloating

bind = $mainMod ALT, T, exec, settiled
bind = $mainMod ALT, 36, exec, settiled

bind = $mainMod ALT, P, pseudo
bind = $mainMod SHIFT, P, togglesplit

bind = $mainMod, N, exec, /usr/bin/Thunar

## ? More example binds, see https://wiki.hyprland.org/Configuring/Binds
bindr = $mainMod, E, exec, pkill nwgbar || nwgbar
bindr = $mainMod, END, exec, pkill nwgbar || nwgbar

# bind = SUPER_SHIFT, ENTER, exec, nwg-drawer -close || nwg-drawer -r -d

bind = $mainMod, D, exec, pkill nwg-menu || nwg-menu -term footclient -wm hyprland -va top -t -k -padding 4 -mr 2 -mb 2 -isl 40 -iss 24
bindr = $mainMod ALT, D, exec, pkill nwgdmenu || nwgdmenu -run -r 40

bindr = $mainMod SHIFT, R, exec, nwg-hud -m "Hyprland process reloading, please wait..." && hyprctl reload && nwg-hud -m "Hyprland process reloaded successfully?"

## * Reload Waybar
bindr = $mainMod SHIFT, W, exec, nwg-hud -m "HyprShell, Waybar service restarting..." && systemctl --user stop hyprshell.service && systemctl --user restart hyprshell.service && nwg-hud -m "HyprShell, Waybar service restarted successfully!"

bindr = $mainMod, T, exec, /usr/bin/footclient || systemctl restart --user foot && /usr/bin/footclient
bindr = $mainMod, 36, exec, /usr/bin/footclient || systemctl restart --user foot && /usr/bin/footclient
bindr = $mainMod, ENTER, exec, /usr/bin/footclient systemctl restart --user foot && /usr/bin/footclient

# bind = $mainMod ALT, F, exec, nwg-hud -m "Killing Foot terminal client, server processes..." && pkill foot || nwg-hud -m "Starting new Foot terminal server background process..." && foot --server --hold

bindr = $mainMod SHIFT, ENTER, exec, /usr/bin/alacritty --daemon

## * Restart wallpaper daemon process, running in background.
bindr = $mainMod ALT, C, exec, pkill swww-daemon && nwg-hud -m "swww-daemon process restarting..." && systemctl restart --user swww-daemon-run.service

# bind = $mainMod SHIFT, H, exec, ~/.config/hypr/scripts/show_desktop.sh
bind = $mainMod, O, exec, $browser || firedragon
bind = $mainMod SHIFT, O, exec, /usr/bin/firefox-developer-edition
bind = $mainMod SHIFT, C, exec, pkill hyprpicker || hyprpicker -a

## * Launch favorite apps, programs via F1-F12 bindings
## * Mainmod + Function keys
bind = $mainMod, F1, exec, $browser || firedragon || firefox-developer-edition
bind = $mainMod, F2, exec, pkill $visual || $visual
bind = $mainMod, F3, exec, ~/.local/bin/alacritty-open
bind = $mainMod, F4, exec, "/usr/bin/waveterm --enable-features=UseOzonePlatform --ozone-platform-hint=auto --no-sandbox"
bind = $mainMod, F5, exec, bleachbit
bind = $mainMod, F6, exec, pkill proton-pass || proton-pass
bind = $mainMod, F7, exec, thunderbird -addressbook
# bind = $mainMod, F8, exec, bash -c "LD_LIBRARY_PATH=/opt/gpt4all-chat/lib /opt/gpt4all-chat/bin/gpt4all-chat"
bind = $mainMod, F9, exec, garuda-assistant
# bind = $mainMod, F10, exec, qt6ct
bind = $mainMod, F11, exec, pkill nwg-look || nwg-look
bind = $mainMod, F12, exec, firewall-config

## * Alternate Mainmod + Function keys
bind = $mainMod SHIFT, F1, exec, google-chrome-beta || google-chrome
bind = $mainMod SHIFT, F2, exec, neovide
bind = $mainMod SHIFT, F3, exec, pacseek
bind = $mainMod SHIFT, F4, exec, nwg-readme-browser
bind = $mainMod SHIFT, F5, exec, xhost bleachbit-root
bind = $mainMod SHIFT, F6, exec, gparted
bind = $mainMod SHIFT, F7, exec, pkill systemadm || systemadm
bind = $mainMod SHIFT, F8, exec, deluge
bind = $mainMod SHIFT, F9, exec, garuda-settings-manager
bind = $mainMod SHIFT, F10, exec, qt5ct
bind = $mainMod SHIFT, F11, exec, snapper-tools
bind = $mainMod SHIFT, F12, exec, snes9x-gtk

## * Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, H, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, L, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, K, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, J, movefocus, d

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

## * Switch workspaces with mainMod + [0-9]s
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

## * Move to workspace with focused container with ALT + SHIFT + [0-9]
bind = ALT SHIFT, 1, movetoworkspace, 1
bind = ALT SHIFT, 2, movetoworkspace, 2
bind = ALT SHIFT, 3, movetoworkspace, 3
bind = ALT SHIFT, 4, movetoworkspace, 4
bind = ALT SHIFT, 5, movetoworkspace, 5
bind = ALT SHIFT, 6, movetoworkspace, 6
bind = ALT SHIFT, 7, movetoworkspace, 7
bind = ALT SHIFT, 8, movetoworkspace, 8
bind = ALT SHIFT, 9, movetoworkspace, 9
bind = ALT SHIFT, 0, movetoworkspace, 10

## * Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

## * Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bind = $mainMod, g, togglegroup
bind = $mainMod, tab, changegroupactive

## * Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

## * set volume (laptops only and may or may not work on PCs)
bind = ,122, exec, pamixer --decrease 5 nwg-hud -m " Volume: "$(pamixer --get-volume) -t 500
bind = ,123, exec, pamixer --increase 5 nwg-hud -m " Volume: "$(pamixer --get-volume) -t 500
bind = ,121, exec, pamixer --toggle-mute nwg-hud -m " Volume: Toggle-mute" -t 500

bind = ,XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle nwg-hud -m "System Mic: Toggle-mute" -t 500

## * other bindings
bind = $mainMod, M, fullscreen, 1
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreenstate, 0 2
bind = ,232,exec,brightnessctl -c backlight set 5%-
bind = ,233,exec,brightnessctl -c backlight set +5%

## * for resizing window
## * will switch to a submap called resize
bind = $mainMod, R, submap, resize

## * will start a submap called "resize"
submap = resize

## * sets repeatable binds for resizing the active window
bind = ,right,resizeactive,50 0
bind = ,L,resizeactive,50 0
bind = ,left,resizeactive,-50 0
bind = ,H,resizeactive,-50 0
bind = ,up,resizeactive,0 -50
bind = ,K,resizeactive,0 -50
bind = ,down,resizeactive,0 50
bind = ,J,resizeactive,0 50

## * use reset to go back to the global submap
bind=,escape,submap,reset

## * will reset the submap, meaning end the current one and return to the global one
submap = reset

## *  to move window
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, L, movewindow, r

## * video play paues bindings
bind=,172,exec,playerctl play-pause
bind=,171,exec,playerctl next
bind=,173,exec,playerctl previous

## * screenshot
## *  Snip a selection and pipe to swappy
bind = ,Print, exec, grim -g "$(slurp)" - | swappy -f -
## *  Screenshot a window and pipe to swappy
bind = CTRL, Print, exec, ~/.config/hypr/scripts/screenshot_window.sh
## *  Screenshot the current display and pipe to swappy
bind = SHIFT, Print, exec, ~/.config/hypr/scripts/screenshot_display.sh

bind = $mainMod SHIFT, Print, exec, grimblast save screen && nwg-hud -m "Screenshot Captured?"
bind = SHIFT, Print, exec, grimblast save area && nwg-hud -m "Selected Area Captured?"
bind = ALT, Print, exec, grimblast save active && nwg-hud -m "Active Window Captured?"
bind = ALT SHIFT, Print, exec, grimblast output active && nwg-hud -m "Output captured"

