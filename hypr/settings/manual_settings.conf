## ? some env variables
env = XDG_CURRENT_DESKTOP,Hyprland
## ? we usually prefer things to be set up through script
## ? have a look at hyprstart file

## ? Performance Tweaks (For less power consumption without sacrificing performance)
## ! See : https://wiki.hyprland.org/Configuring/Performance/
## ! See https://wiki.hyprland.org/Configuring/Master-Layout/ for more

general {
    layout = dwindle
    allow_tearing = true
    border_size = 1
    resize_on_border = true
    extend_border_grab_area = 12
    gaps_in = 2,4,2,4
    gaps_out = 6,12,6,12
    gaps_workspaces = 4
    float_gaps = 2
    col.active_border = rgba(00ff52eb)
    col.inactive_border = rgba(00e0fff2)

    snap {
        enabled = true
        window_gap = 2
        monitor_gap = 2
        border_overlap = true
        respect_gaps = true
    }
}

ecosystem {
    enforce_permissions = true
}

# gestures {
# ## ! See https://wiki.hyprland.org/Configuring/Variables/ for more
