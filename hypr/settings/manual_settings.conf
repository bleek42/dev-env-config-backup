# gesture = 2, swipe, scale: 0.75, float

## # ###################################################
## # ###  _  __          _                         _  ##
## # ### | |/ /___ _   _| |__   ___   __ _ _ __ __| | ##
## # ### | ' // _ \ | | | '_ \ / _ \ / _` | '__/ _` | ##
## # ### | . \  __/ |_| | |_) | (_) | (_| | | | (_| | ##
## # ### |_|\_\___|\__, |_.__/ \___/ \__,_|_|  \__,_| ##
## # ###           |___/                              ##
## # ###################################################

input {
    kb_layout = us
    # kb_variant =
    # kb_model =
    # kb_options = ctrl:nocaps
    # kb_rules =
    numlock_by_default= true
    follow_mouse = 1
    mouse_refocus = 2
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

## # ####################################################
## # ##  _____                _                     _  ##
## # ## |_   _|__  _   _  ___| |__  _ __   __ _  __| | ##
## # ##   | |/ _ \| | | |/ __| '_ \| '_ \ / _` |/ _` | ##
## # ##   | | (_) | |_| | (__| | | | |_) | (_| | (_| | ##
## # ##   |_|\___/ \__,_|\___|_| |_| .__/ \__,_|\__,_| ##
## # ##                            |_|                 ##
## # ####################################################

    touchpad {
        natural_scroll = true
        disable_while_typing = true
        middle_button_emulation = true
        scroll_factor = 1.0
        tap-to-click = true
        drag_3fg = 1
    }

    touchdevice {
        output = eDP-1
    }

    tablet {
        output = eDP-1
    }

    virtualkeyboard {
        release_pressed_on_close = true
    }

}

## # ##########################################################
## # ###     _          _                 _   _              ##
## # ###    / \   _ __ (_)_ __ ___   __ _| |_(_) ___  _ __   ##
## # ###   / _ \ | '_ \| | '_ ` _ \ / _` | __| |/ _ \| '_ \  ##
## # ###  / ___ \| | | | | | | | | | (_| | |_| | (_) | | | | ##
## # ### /_/   \_\_| |_|_|_| |_| |_|\__,_|\__|_|\___/|_| |_| ##
## # ##########################################################

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5, myBezier
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
## ! See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more

    ## ? master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    pseudotile = true

    ## ? you probably want this
    smart_split = true

    ## ? specifies which window will receive the larger half of a split. positional - 0, current window - 1, opening window - 2 [0/1/2]
    split_bias = 1

    ## ? bindm movewindow will drop the window more precisely depending on where your mouse is
    precise_mouse_move = 1

}

render {
    new_render_scheduling = true
}

## # ######################################
## # ###   ___  _   _                    ##
## # ###  / _ \| |_| |__   ___ _ __ ___  ##
## # ### | | | | __| '_ \ / _ \ '__/ __| ##
## # ### | |_| | |_| | | |  __/ |  \__ \ ##
## # ###  \___/ \__|_| |_|\___|_|  |___/ ##
## # ######################################

decoration {
    rounding = 6
    rounding_power = 1.5
    fullscreen_opacity = 0.92
    dim_inactive = true
    dim_strength = 0.1
    dim_around = 0.1

    ## ! See https://wiki.hyprland.org/Configuring/Variables/ for more

    blur {
       enabled = true
       size = 3
       passes = 1
       xray = on
       brightness = 0.6
       noise = 0.15
       contrast = 1.55
       vibrancy = 0.75
       vibrancy_darkness = 0.95
       ignore_opacity = false
       special = false
    }

    shadow {
        enabled = true
        color = rgba(12adbdd1)
        color_inactive = rgba(334a47c9)
        range = 10
        render_power = 2
    }
}

binds {
    workspace_center_on = 1
    movefocus_cycles_groupfirst = true
    allow_pin_fullscreen = true
}

cursor {
    default_monitor = eDP-1
    inactive_timeout = 45
    hide_on_key_press = true
    warp_on_change_workspace = 1
    warp_on_toggle_special = 1
}

xwayland {
    create_abstract_socket = true
}

misc {
    # animate_mouse_windowdragging = true
    vrr = 0
    vfr = true
    font_family = 'ProFontWindows Font Mono'
    splash_font_family = 'ProFontIIx Nerd Font Mono'
    on_focus_under_fullscreen = 1
    # workspace_back_and_forth = trues
    middle_click_paste = false
    key_press_enables_dpms = true
    mouse_move_focuses_monitor = true
    layers_hog_keyboard_focus = true
    allow_session_lock_restore = true

}

