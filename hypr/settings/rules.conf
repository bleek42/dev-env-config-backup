# layerrule = blur, waybar
layerrule = order 3, blur on, animation slide top, match:namespace ^(dropdown).*$
layerrule = order 5, blur on, animation slide top, match:namespace ^nwg-(drawer|grid)$
# layerrule = order 3, blur on, animation slide, match:namespace ^waybar$


