windowrule {
    name = menu_small
    match:class = ^(wofi|dmenu).*$
    size = 640 640
    opacity = 0.8
    stay_focused = on
    dim_around = on
    no_dim = on
}

windowrule {
    name = su-dialogue
    match:class = .*(ssh-askpass)$
    match:title = ^([Pp]olkit).*$
    match:modal = on
    float = 1
    size = 560 480
    opacity = 0.8
    center = 1
    stay_focused = on
    dim_around = on
    no_dim = on
}

windowrule {
    name = laptop_monitor
    # match:workspace = 1
    # match:float = on
    max_size = 1905 980
}

windowrule {
    name = big_float
    match:class = ^([Tt]hunar|system|nwg|re.rizin|[Gg][Pp]arted).*$
    float = 1
    size = 1280 990
    center = on
}

windowrule {
    name = title_end_float
    match:title = .*(jadx-gui)$
    float = 1
    size = 2584 1175
    center = 1
    workspace = 4
}

windowrule {
    name = float_styles
    match:float = on
    # max_size = 1600 1400
    opacity = 0.92 0.87
    border_color = rgba(00edffeb)
    border_size = 2
}

windowrule {
    name = web_browsers
    match:title = .*(Firefox|FireDragon|Edge)$
    workspace = 3
}

windowrule {
    name = tiled_editor
    match:class = ^(codium|neovide).*$
    tile = on
    # pseudo = on
    opacity = 0.85 0.8
    border_color = rgba(00ffabf2)
}

windowrule {
    name = garuda_gtk_qt
    match:class = ^(garuda|gsconnect|org.gnome|org.wireshark|org.pulseaudio|qdbusviewer).*$
    float = 1
    size = 1400 1020
    opacity = 0.9
}

windowrule {
    name = term_float
    match:initial_title = ^(Shell|foot).*$
    float = 1
    size = 1900 980
    opacity = 0.85
    center = 1
}

windowrule {
    name = big_title
    match:title = ^(Wave|Meld|Kvantum|Neovide|[Ss]etting|[Bb]luetooth|pdf|Avahi|V4L2|[Vv][Nn][Cc]|[Aa]ssistant|[Pp]roton|[Bb]leachBit|[Pp]ace|[Hh]yprshell|[Gg]hidra).*$
    float = 1
    size = 1820 1050
    opacity = 0.9 0.8
}

# match:class = ^(blueman-manager).*$
windowrule {
    name = big_popup
    match:title = ^([Oo]pen|[Ss]ave|[Aa]dd|[Ff]older|[Ff]ile|[Ll]og|[Ss]ign|[Aa]uth|[Rr]espond|[Ww]elcome|[Ll]ibrary|[Bb]rowser).*$
    size = 1260 1000
    move = (cursor_x-(window_w*0.5)) (cursor_y-(window_h*0.5))
    float = 1
    center = 1
    dim_around = on
    no_dim = on
    stay_focused = on
}

## * Check for bugs such as null pointer references, unhandled exceptions, and more.
windowrule {
    name = small_popup
    match:title = ^([Ee]xit|[Ee]xception|[Ee]rror|[Ww]arning|[Nn]ull|[Uu]nhandled|[Bb]ug|[Tt]ip).*$
    match:modal = on
    size = 640 800
    float = 1
    center = 1
    dim_around = on
    no_dim = on
    stay_focused = on
    no_close_for = 2500
}
