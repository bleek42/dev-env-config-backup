source = ~/.config/hypr/settings/monitor.conf
source = ~/.config/hypr/settings/rules.conf
source = ~/.config/hypr/settings/execute.conf
source = ~/.config/hypr/settings/bindings.conf
source = ~/.config/hypr/settings/manual_settings.conf
