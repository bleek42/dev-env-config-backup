$mainMod = SUPER
$browser = firefox-developer-edition
$fileManagerGui = thunar
$fileManagerTui = "/usr/bin/nnn"
$editor = /usr/bin/nvim
$visual = "/usr/bin/codium --wait --enable-features=UseOzonePlatform,WaylandWindowDecorations --ozone-platform=wayland"
$launcher = wofi
$exit = pkill wofi

windowrule = float on, center on, stay_focused on, no_dim on, dim_around on, match:title ^(G-Hyprland)

# * open G-Hyprland script
bind = $mainMod ALT, S, exec, footclient -w 540x540 -T G-Hyprland -e ~/.config/hypr/brain/brain.sh
# * disable G-hyprland
bind = $mainMod ALT, G, exec, footclient -w 540x540 -T G-Hyprland -e ~/.local/bin/bear/implement_gum.sh disable

