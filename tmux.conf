
set-environment -gF TMUX_PLUGIN_MANAGER_PATH '#{HOME}/.config/tmux/plugins'
if 'test ! -d "${TMUX_PLUGIN_MANAGER_PATH}/tpm"' {
  run 'mkdir -p "${TMUX_PLUGIN_MANAGER_PATH}"'
  run 'git clone --depth=1 https://github.com/tmux-plugins/tpm "${TMUX_PLUGIN_MANAGER_PATH}/tpm"'
  run '${TMUX_PLUGIN_MANAGER_PATH}/tpm/bin/install_plugins'
}

### ? Tmux Plugin Manger (tpm) plugins
## ? load tmux plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-yank'

## ? set logging path to ~/.cache/tmux
set -g @logging-path '"${XDG_CACHE_HOME:-${HOME}/.cache}/tmux"'

## ? To create your own status line module that uses the catppuccin theme,
## ? all you need to do is add it to the status-left or status-right options.
## ? You can add arbitrary things to the status line like so:

# * set -agF status-right "#[fg=#{@thm_crust},bg=#{@thm_teal}] ##H "

## ? This will append the current hostname (#H) to the status line
## ? with a teal background and dark black text.
## ? You can also use icons for styling, for example
## ? to show the used memory percentage on MacOS:

## ? Example of the custom ram module
# * set -g status-right "#[bg=#{@thm_flamingo},fg=#{@thm_crust}]#[reverse]#[noreverse]󱀙  "
# * set -ag status-right "#[fg=#{@thm_fg},bg=#{@thm_mantle}] #(memory_pressure | awk '/percentage/{print $5}') "

## ? To use the status module formatting that catppuccin uses, do the following
## ? in your tmux.conf, before the catppuccin plugin has been loaded.

set -g @plugin 'anghootys/tmux-ip-address'
set -g @ip_address_refresh_key '\\'

# %hidden CUSTOM_IP_MODULE="custom_ip_module"

# set -g "@catppuccin_${CUSTOM_IP_MODULE}_icon" " "
# set -gqF "@catppuccin_${CUSTOM_IP_MODULE}_color" "#{E:@thm_green}"
# set -gq "@catppuccin_${CUSTOM_IP_MODULE}_text" "#{ip_address} | #H"

# source "~/.config/tmux/plugins/tmux/utils/status_module.conf"

## ? use catppuccin color theming, which-key for tmux
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'alexwforsythe/tmux-which-key'

## ? set catppuccin "flavor" of color palette to use
set -g @catppuccin_flavor 'mocha'

## ? Window settings
set -g @catppuccin_window_status_style "custom" # * basic, rounded, slanted, custom, or none
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_left_separator "█ "
set -g @catppuccin_window_middle_separator " █ "
set -g @catppuccin_window_right_separator " █"
set -g @catppuccin_window_text " #I#{?#{!=:#{b:window_name},},: #W ,}"
set -g @catppuccin_window_text_color "#{@thm_surface_1}"
set -g @catppuccin_window_current_text " #I#{?#{!=:#{b:window_name},},: #W ,}"
set -g @catppuccin_window_number " 󰖮 #I "
set -g @catppuccin_window_number_color "#{@thm_mauve}"
set -g @catppuccin_window_current_number " 󰖲 #I "
set -g @catppuccin_window_current_number_color "#{@thm_green}"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_flags "icon" # * none, icon, or text
set -g @catppuccin_window_flags_icon_last " " # * -
set -g @catppuccin_window_flags_icon_current " " # * *
set -g @catppuccin_window_flags_icon_zoom " " # * Z
set -g @catppuccin_window_flags_icon_mark " " # * M
set -g @catppuccin_window_flags_icon_silent " " # * ~
set -g @catppuccin_window_flags_icon_activity " " # * #
set -g @catppuccin_window_flags_icon_bell " " # * !

## ? Matches icon order when using `#F` (`#!~[*-]MZ`)
set -g @catppuccin_window_flags_icon_format "##{?window_activity_flag,#{E:@catppuccin_window_flags_icon_activity},}##{?window_bell_flag,#{E:@catppuccin_window_flags_icon_bell},}##{?window_silence_flag,#{E:@catppuccin_window_flags_icon_silent},}##{?window_active,#{E:@catppuccin_window_flags_icon_current},}##{?window_last_flag,#{E:@catppuccin_window_flags_icon_last},}##{?window_marked_flag,#{E:@catppuccin_window_flags_icon_mark},}##{?window_zoomed_flag,#{E:@catppuccin_window_flags_icon_zoom},} "

## ? Pane settings
set -g @catppuccin_pane_status_enabled "yes" # * set to "yes" to enable
set -g @catppuccin_pane_border_status "yes" # * set to "yes" to enable
set -g @catppuccin_pane_border_style "#{@thm_overlay_1}"
set -g @catppuccin_pane_active_border_style "##{?pane_in_mode,fg=#{@thm_lavender},##{?pane_synchronized,fg=#{@thm_mauve},fg=#{@thm_lavender}}}"
set -g @catppuccin_pane_left_separator "█ "
set -g @catppuccin_pane_middle_separator " █ "
set -g @catppuccin_pane_right_separator " █"
set -g @catppuccin_pane_color "#{@thm_green}"
set -g @catppuccin_pane_background_color "#{@thm_surface_1}"
set -g @catppuccin_pane_default_text "#{b:pane_current_path}"
set -g @catppuccin_pane_default_fill "number"
set -g @catppuccin_pane_number_position "left" # * right, left

## ? Status settings
set -g @catppuccin_status_fill "all"
set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_middle_separator " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_background "#{@thm_surface_0}"
set -g @catppuccin_status_module_bg_color "#{@thm_surface_0}"
set -g @catppuccin_status_connect_separator "yes" # yes, no

## ? vim nav, fzf, pomodoro, misc. plugins
set -g @plugin 'christoomey/vim-tmux-navigator' ## * navigate panes with Ctrl-hjkl
set -g @plugin 'olimorris/tmux-pomodoro-plus'
set -g @plugin 'sainnhe/tmux-fzf'


## ? Ressurect Plugin
set -g @plugin 'tmux-plugins/tmux-resurrect' ## * persist sessions after restart
set -g @plugin 'tmux-plugins/tmux-continuum' ## * automatically save sessions every 15 mins

set -g @continuum-boot 'on' ## * enable tmux-continuum functionality
set -g @continuum-restore 'on' ## * enable tmux-continuum functionality
set -g @resurrect-capture-pane-contents 'on' ## * allow tmux-ressurect to capture pane contents
set -g @resurrect-strategy-nvim 'session'

set -g @plugin 'omerxx/tmux-sessionx' ## * tmux
## * `C-x` is customizeable, by default it indexes directories in `$HOME/.config`,
## * but this can be changed by adding the config below.
## * e.g. set -g @sessionx-x-path '~/dotfiles'
# set -g @sessionx-x-path '<some-path>'

## * A comma delimited absolute-paths list of custom paths
## * always visible in results and ready to create a session from.
## * Tip: if you're using zoxide mode, there's a good chance this is redundant
# set -g @sessionx-custom-paths '$HOME/.config,$HOME/.config/rc.d,$HOME/.local/share,$HOME/Documents,/etc,/usr/local/share,/usr/share,/mnt'

set -g @sessionx-bind 'S'
set -g @sessionx-prefix on      ## * using `o` if not already in use, for least key strokes when launching

set -g @sessionx-fzf-builtin-tmux 'on'

## * A boolean flag, if set to true, will also display subdirectories
## * under the aforementioned custom paths, e.g. /Users/me/projects/tmux-sessionx
set -g @sessionx-custom-paths-subdirectories 'false'

## * By default, the current session will not be shown on first view
## * This is to support quick switch of sessions
## * Only after other actions (e.g. rename) will the current session appear
## * Setting this option to 'false' changes this default behavior
set -g @sessionx-filter-current 'false'

## * Window mode can be turned on so that the default layout
## * Has all the windows listed rather than sessions only
set -g @sessionx-window-mode 'off'

## * Customize `ls` command to display your directories nicely (default: `ls`)
## * Can be used with `exa`, `lsd`, or other command of your choice to
## * set preview window to match your preference
set -g @sessionx-ls-command 'command lsd -A --color=always --icon=always --total-size --tree --depth=2 || command ls -A -l --si -p -h -u -X -H -G --group-directories-first -I=.git'

## * When set to 'on' a non-result will be sent to zoxide for path matching
## * Requires zoxide installed
set -g @sessionx-zoxide-mode 'on'

## * Tree mode can be enabled which means that instead of a preview,
## * a hierarchy of sessions and windows will be shown
set -g @sessionx-tree-mode 'off'

## * Preview location and screenspace can be adjusted with these
## * Reminder: it can be toggeled on/off with `?`
set -g @sessionx-preview-location 'right'
set -g @sessionx-preview-ratio '60%'

## * The preview can also be disabled altogether
set -g @sessionx-preview-enabled 'true'

## * Change window dimensions
set -g @sessionx-window-height '80%'
set -g @sessionx-window-width '70%'

## * If you want change the layout to top you can set
set -g @sessionx-layout 'reverse'

## * When set to 'on' a non-result will be sent to zoxide for path matching
## * Requires zoxide installed

## * If you want to pass in your own FZF options. This is passed in before all other
## * arguments to FZF to ensure that other options like `sessionx-pointer` and
## * `sessionx-window-height/width` still work. See `man fzf` for config options.
# set -g @sessionx-additional-options "--color pointer:9,spinner:92,marker:46"

## * If you're running fzf lower than 0.35.0 there are a few missing features
## * Upgrade, or use this setting for support
set -g @sessionx-legacy-fzf-support 'off'

## * With Tmuxinator turned 'on' (off by default), the plugin will take a given name
## * and look for a tmuxinator project with that name.
## * If found, it'll launch the template using tmuxinator
set -g @sessionx-tmuxinator-mode 'off'

set -g @sessionx-prompt "󰘧 "    ## * If you want to change the prompt, the space is nedded to not overlap the icon
set -g @sessionx-pointer "▶ "   ## * If you want to change the pointer

## ? Floax Plugin
## ? M- means "hold Meta/Alt"
## ? EX: set -g @floax-bind '-n M-p'
set -g @plugin 'omerxx/tmux-floax'
set -g @floax-bind '-n M-p'

## ? Plugins Settings
set -g @floax-title 'floax'
set -g @floax-session-name 'floax'
set -g @floax-width '80%'
set -g @floax-height '70%'
set -g @floax-border-color 'brightcyan'
set -g @floax-text-color 'brightgreen'
set -g @floax-change-path 'true'

## ? Pomodoro configuration
# set -g @pomodoro_toggle 'P'  ## * Start/pause a Pomodoro/break
# set -g @pomodoro_cancel 'P'  ## * Cancel the current session
set -g @pomodoro_skip '_'    ## * Skip a Pomodoro/break
set -g @pomodoro_mins 25          ## * The duration of Pomodoro
set -g @pomodoro_break_mins 5     ## * The duration of the break after Pomodoro completes
set -g @pomodoro_intervals 4      ## * intervals before longer break is started
set -g @pomodoro_long_break_mins 25    ## * The duration of the long break
set -g @pomodoro_repeat 'off'          ## * Automatically repeat Pomodoros?
set -g @pomodoro_disable_breaks 'off'  ## * Turn off breaks
set -g @pomodoro_on " 🍅 "              ## * Formatted output when Pomodoro is running
set -g @pomodoro_complete " ✔︎"         ## * Formatted output when the break is running
set -g @pomodoro_pause " ⏸︎ "      ## * Formatted output when Pomodoro/break is paused
set -g @pomodoro_prompt_break " ⏲︎ break?"  ## * Formatted output when waiting to start break
set -g @pomodoro_prompt_pomodoro " ⏱︎ start?"   ## * Formatted output when waiting to start
set -g @pomodoro_menu_position "L"             ## * Location of menu relative to the screen
set -g @pomodoro_sound 'on'       		## * Sound for desktop notifications
set -g @pomodoro_notifications 'on'     ## * Enable desktop notifications from your terminal
set -g @pomodoro_granularity 'on'  ## * Enable MM:SS format (default is just M)

### ? -- general -------------------------------------------------------------------

## ? If running inside tmux ($TMUX is set), then change the status line to red
# if -b '#{TMUX}' 'set -g status-bg red'

# set -g default-terminal 'tmux-256color'
# if -b '#{ZSH_TMUX_TERM}' 'set -g default-terminal #{ZSH_TMUX_TERM}'

set -g mouse on
set -g detach-on-destroy off     # * don't exit from tmux when closing a session
set -g escape-time 0

## ? Rather than constraining window size to the maximum size of any client
## ? connected to the *session*, constrain window size to the maximum size of any
## ? client connected to *that window*. Much more reasonable.
setw -g aggressive-resize on

unbind C-b
set -g prefix C-a
bind C-a send-prefix

unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

### ? reload configuration
unbind r
# bind r run source-file "${ZSH_TMUX_CONFIG:-${HOME}/.config/tmux/tmux.conf}" \; display-message 'TMUX config re-sourced..!'

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z

### ? -- display -------------------------------------------------------------------

set -g base-index 1           ## * start windows numbering at 1
set -g history-limit 100000   ## * set scrollback/buffer history way higher than default

# window style
setw -g automatic-rename on
setw -g automatic-rename-format '#{?pane_in_mode,[tmux],#{pane_current_command}}#{?pane_dead,[dead],} #{b:pane_current_path}'
setw -g status-justify 'absolute-centre'
setw -g pane-base-index 1     ## * make pane numbering consistent with windows

set -g set-titles on          ## * set terminal title
set -g renumber-windows on    ## * renumber windows when a window is closed
set -g display-time 1200      ## * slightly longer status messages display time
set -g display-panes-time 800 ## * slightly longer pane indicators display time
set -g status-interval 15     ## * redraw status line every 15 seconds

## ? Configure Online
set -g @online_icon "OK"
set -g @offline_icon "NO"

## ? clear both screen and history
# bind -n C-l send-keys C-l\; run 'sleep 0.2'\; clear-history

## ? activity
set -g monitor-activity on
set -g visual-activity on

### ? -- copy mode -----------------------------------------------------------------

bind Enter copy-mode ## * enter copy mode

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

## * Some extra key bindings to select higher numbered windows
bind F1 selectw -t:10
bind F2 selectw -t:11
bind F3 selectw -t:12
bind F4 selectw -t:13
bind F5 selectw -t:14
bind F6 selectw -t:15
bind F7 selectw -t:16
bind F8 selectw -t:17
bind F9 selectw -t:18
bind F10 selectw -t:19
bind F11 selectw -t:20
bind F12 selectw -t:21

## ? status left style
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#[bg=#{@thm_surface_0},fg=#{@thm_blue},bold]"
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_sky},fg=#{@thm_mantle},bold]  #S },#{#[bg=#{@thm_mantle},fg=#{@thm_green}]  #S }}"
set -ga status-left "#[bg=#{@thm_mantle},fg=#{@thm_lavender},bold] "
set -ga status-left "#[bg=#{@thm_surface_0},fg=#{@thm_peach},bold]  #{pane_current_command} "
set -ga status-left "#[bg=#{@thm_surface_0},fg=#{@thm_lavender},bold] "

## ? status right style
set -g status-right-length 100
set -g status-right ""
# set -gaF status-right "#{E:@catppuccin_status_pomodoro_plus}"
set -ga status-right "#[bg=#{@thm_surface_0},fg=#{@thm_lavender},bold]"
set -ga status-right "#[bg=#{@thm_mantle},fg=#{@thm_green},bold] 󰩟 #{ip_address} "
set -ga status-right "#[bg=#{@thm_mantle},fg=#{@thm_lavender},bold] "
set -ga status-right "#[bg=#{@thm_mantle},fg=#{@thm_sky},bold] 󰭦 %Y/%m/%d 󰅐 %H:%M "
set -ga status-right "#[bg=#{@thm_mantle},fg=#{@thm_blue},bold] "

## * Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run-shell ~/.config/tmux/plugins/tpm/tpm
